[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "curvature-compass"
version = "0.1.0"
description = "Phase 1 synthetic research on optimization-relevant directional curvature"
requires-python = ">=3.10"
dependencies = ["numpy==2.2.6", "scipy==1.15.3", "matplotlib==3.10.7"]

[tool.setuptools.packages.find]
where = ["src"]
